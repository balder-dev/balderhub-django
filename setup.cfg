[metadata]
name = balderhub-django
description = balderhub-django: BalderHub Project for testing Django Framework Applications
author = Max Stahlschmidt
long_description = file: README.md
long_description_content_type = text/markdown
url = https://hub.balder.dev/projects/django
license = MIT
license_files = LICENSE
platforms = unix, linux, osx, cygwin, win32
keywords = test, systemtest, reusable, scenario, junit, balder
classifiers =
    License :: OSI Approved :: MIT License
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Topic :: Software Development :: Libraries
    Topic :: Software Development :: Testing
    Topic :: Utilities
project_urls =
    Source=https://github.com/balder-dev/balderhub-django/
    Tracker=https://github.com/balder-dev/balderhub-django/issues

[options]
packages =
    balderhub.django
    balderhub.django.contrib.crud
    balderhub.django.contrib.crud.pages
    balderhub.django.contrib.crud.pages.admin
    balderhub.django.contrib.crud.scenario_features
    balderhub.django.contrib.crud.setup_features
    balderhub.django.contrib.crud.setup_features.factories
    balderhub.django.contrib.crud.utils
    balderhub.django.contrib.crud.utils.field_callbacks
    balderhub.django.lib
    balderhub.django.lib.pages
    balderhub.django.lib.pages.admin
    balderhub.django.lib.scenario_features
    balderhub.django.lib.setup_features
    balderhub.django.lib.utils
    balderhub.django.lib.utils.gui
    balderhub.django.lib.utils.gui.admin
    balderhub.django.lib.utils.gui.admin.change_form_fields
    balderhub.django.lib.utils.gui.admin.widgets
    balderhub.django.lib.utils.response_messages
    balderhub.django.scenarios
    balderhub.django.setups

install_requires =
    baldertest
    balderhub-data>=0.1.0,<0.2.0
    balderhub-url
python_requires = >=3.10
package_dir =
    =src
setup_requires =
    setuptools
    setuptools-scm>=6.0
zip_safe = no

[options.extras_require]
crud =
    balderhub-crud>=0.0.1b11
    balderhub-url
all =
    balderhub-html[crud]