name: test.yml
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        django-version: [ "5.2.0", "6.0.0"]
        exclude:
          # Django 6.0 only supports 3.12+
          - python-version: "3.10"
            django-version: "6.0.0"
          - python-version: "3.11"
            django-version: "6.0.0"
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      DJANGO_VERSION: ${{ matrix.django-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      - name: Start Docker Environment
        run: |
          docker compose up -d
      - name: Run Tests
        run: |
          docker compose run testa balder --working-dir tests --junit=result.xml
      - name: Cleanup Docker
        if: always()
        run: |
          docker compose down
